<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extraire pages PDF</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
    --border: #d9d9d4; --accent: #2f5bd3; --accent-text: #ffffff;
    --error: #b3261e; --ok: #1e7a3c; --drop: #eef2fd;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161615; --card: #20201f; --text: #ececea; --muted: #a0a09a;
      --border: #3a3a37; --accent: #7a9cff; --accent-text: #10131c;
      --error: #ff8a80; --ok: #7fd49a; --drop: #1f2638;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161615; --card: #20201f; --text: #ececea; --muted: #a0a09a;
    --border: #3a3a37; --accent: #7a9cff; --accent-text: #10131c;
    --error: #ff8a80; --ok: #7fd49a; --drop: #1f2638;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, "Segoe UI", sans-serif;
    display: flex; justify-content: center; padding: 40px 16px;
  }
  main { width: 100%; max-width: 520px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  #drop {
    border: 2px dashed var(--border); border-radius: 10px; padding: 32px 16px;
    text-align: center; cursor: pointer; transition: background .15s, border-color .15s;
  }
  #drop.over { background: var(--drop); border-color: var(--accent); }
  #drop strong { display: block; margin-bottom: 4px; }
  #drop span { color: var(--muted); font-size: .9rem; }
  #file { display: none; }
  #options { display: none; margin-top: 20px; }
  .info { font-weight: 600; word-break: break-all; }
  .count { color: var(--muted); font-size: .9rem; margin-bottom: 16px; }
  label.field { display: block; font-weight: 600; margin-bottom: 6px; }
  input[type=text] {
    width: 100%; padding: 10px 12px; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .hint { color: var(--muted); font-size: .85rem; margin: 6px 0 16px; }
  .modes { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
  .modes label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .actions { display: flex; gap: 8px; justify-content: flex-end; }
  button {
    font: inherit; padding: 9px 18px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--border); background: transparent; color: var(--text);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  #msg { margin-top: 14px; font-size: .95rem; min-height: 1.5em; }
  #msg.error { color: var(--error); }
  #msg.ok { color: var(--ok); }
  footer { color: var(--muted); font-size: .8rem; margin-top: 16px; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>Extraire pages PDF</h1>
  <p class="sub">Choisissez les pages à garder et téléchargez-les dans un nouveau PDF.</p>

  <div class="card">
    <div id="drop" tabindex="0" role="button" aria-label="Choisir un fichier PDF">
      <strong>Déposez un PDF ici</strong>
      <span>ou cliquez pour choisir un fichier</span>
    </div>
    <input type="file" id="file" accept="application/pdf,.pdf">

    <div id="options">
      <div class="info" id="name"></div>
      <div class="count" id="count"></div>

      <label class="field" for="pages">Pages à exporter</label>
      <input type="text" id="pages" placeholder="1-3, 5, 8-" autocomplete="off">
      <div class="hint">Ex. : <code>1-3, 5, 8-</code> (8- = jusqu'à la fin) ou <code>13-14-15-16</code></div>

      <div class="modes">
        <label><input type="radio" name="mode" value="single" checked> Un seul PDF</label>
        <label><input type="radio" name="mode" value="separate"> Un PDF par page (fichier .zip)</label>
      </div>

      <div class="actions">
        <button type="button" id="reset">Autre fichier</button>
        <button type="button" class="primary" id="export">Exporter</button>
      </div>
      <div id="msg" role="status"></div>
    </div>
  </div>
  <footer>Le fichier reste sur votre ordinateur : tout se passe dans le navigateur, rien n'est envoyé.</footer>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const { PDFDocument } = PDFLib;
const $ = id => document.getElementById(id);
let srcDoc = null, srcName = "", total = 0;

// Même syntaxe que la version Python : "1-3, 5, 8-", "13-14-15-16", "4-2"
function parsePages(text, total) {
  const pages = [];
  for (const part of text.trim().split(/[,;\s]+/)) {
    if (!part) continue;
    if (/^\d+(-\d+){2,}$/.test(part)) {
      for (const n of part.split("-").map(Number)) {
        if (n < 1 || n > total) throw new Error(`La page ${n} sort du document (1 à ${total}).`);
        pages.push(n - 1);
      }
      continue;
    }
    let start, end, m;
    if ((m = part.match(/^(\d*)-(\d*)$/))) {
      start = m[1] ? +m[1] : 1;
      end = m[2] ? +m[2] : total;
    } else if (/^\d+$/.test(part)) {
      start = end = +part;
    } else {
      throw new Error(`Saisie invalide : « ${part} »`);
    }
    if (start < 1 || start > total || end < 1 || end > total)
      throw new Error(`« ${part} » sort du document (1 à ${total}).`);
    const step = end >= start ? 1 : -1;
    for (let i = start; i !== end + step; i += step) pages.push(i - 1);
  }
  if (!pages.length) throw new Error("Aucune page indiquée.");
  return pages;
}

const labelFor = text => text.trim().replace(/[^\d-]+/g, "_").replace(/^_+|_+$/g, "");

function setMsg(text, kind = "") { $("msg").textContent = text; $("msg").className = kind; }

async function loadFile(file) {
  if (!file) return;
  if (!/\.pdf$/i.test(file.name) && file.type !== "application/pdf") {
    alert("Ce fichier n'est pas un PDF."); return;
  }
  try {
    srcDoc = await PDFDocument.load(await file.arrayBuffer(), { ignoreEncryption: true });
  } catch (e) {
    alert("Impossible d'ouvrir le PDF :\n" + e.message); return;
  }
  srcName = file.name.replace(/\.pdf$/i, "");
  total = srcDoc.getPageCount();
  $("name").textContent = file.name;
  $("count").textContent = `${total} page${total > 1 ? "s" : ""}`;
  $("drop").style.display = "none";
  $("options").style.display = "block";
  setMsg("");
  $("pages").value = "";
  $("pages").focus();
}

async function buildPdf(indexes) {
  const out = await PDFDocument.create();
  const copied = await out.copyPages(srcDoc, indexes);
  copied.forEach(p => out.addPage(p));
  return out.save();
}

// Demande où enregistrer quand le navigateur le permet (Chrome, Edge), sinon téléchargement classique
async function saveBlob(blob, suggestedName, mime, ext) {
  if (window.showSaveFilePicker) {
    try {
      const handle = await showSaveFilePicker({
        suggestedName, types: [{ description: ext.toUpperCase(), accept: { [mime]: ["." + ext] } }],
      });
      const w = await handle.createWritable();
      await w.write(blob); await w.close();
      return handle.name;
    } catch (e) {
      if (e.name === "AbortError") return null;
    }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = suggestedName;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  return suggestedName;
}

async function exportPages() {
  let pages;
  try { pages = parsePages($("pages").value, total); }
  catch (e) { setMsg(e.message, "error"); return; }

  $("export").disabled = true;
  setMsg("Préparation…");
  try {
    let saved;
    if (document.querySelector("input[name=mode]:checked").value === "separate") {
      const zip = new JSZip();
      for (const i of pages) zip.file(`${srcName}_page_${i + 1}.pdf`, await buildPdf([i]));
      const blob = await zip.generateAsync({ type: "blob" });
      saved = await saveBlob(blob, `${srcName}_pages_${labelFor($("pages").value)}.zip`, "application/zip", "zip");
    } else {
      const blob = new Blob([await buildPdf(pages)], { type: "application/pdf" });
      saved = await saveBlob(blob, `${srcName}_pages_${labelFor($("pages").value)}.pdf`, "application/pdf", "pdf");
    }
    setMsg(saved ? `Enregistré : ${saved}` : "Enregistrement annulé.", saved ? "ok" : "");
  } catch (e) {
    setMsg("Erreur : " + e.message, "error");
  } finally {
    $("export").disabled = false;
  }
}

const drop = $("drop");
drop.addEventListener("click", () => $("file").click());
drop.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("file").click(); } });
$("file").addEventListener("change", e => loadFile(e.target.files[0]));
["dragenter", "dragover"].forEach(t => document.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(t => document.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("over"); }));
document.addEventListener("drop", e => loadFile(e.dataTransfer.files[0]));
$("export").addEventListener("click", exportPages);
$("pages").addEventListener("keydown", e => { if (e.key === "Enter") exportPages(); });
$("reset").addEventListener("click", () => {
  srcDoc = null; $("file").value = "";
  $("options").style.display = "none"; $("drop").style.display = "block";
});
</script>
</body>
</html>
